services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: callagent
      POSTGRES_USER: callagent
      POSTGRES_PASSWORD: callagent
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.29.7
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: callagent
      POSTGRES_PWD: callagent
      POSTGRES_SEEDS: postgres
    ports:
      - "${TEMPORAL_HOST_PORT:-7233}:7233"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "operator", "namespace", "describe", "default", "--address", "temporal:7233"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.53.3
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: "http://localhost:3000"
    ports:
      - "${TEMPORAL_UI_HOST_PORT:-8080}:8080"
    depends_on:
      - temporal

  migrate:
    build:
      context: ./backend
      args:
        REQUIREMENTS: requirements/dev.txt
    command: sh -c "alembic upgrade head && python -m scripts.seed_demo_data"
    restart: "no"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://callagent_app:callagent_app@postgres:5432/callagent
      MIGRATION_DATABASE_URL: postgresql+asyncpg://callagent_migrator:callagent_migrator@postgres:5432/callagent
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_HOST: temporal:7233
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      args:
        REQUIREMENTS: requirements/dev.txt
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${BACKEND_HOST_PORT:-8001}:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://callagent_app:callagent_app@postgres:5432/callagent
      MIGRATION_DATABASE_URL: postgresql+asyncpg://callagent_migrator:callagent_migrator@postgres:5432/callagent
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_HOST: temporal:7233
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    build:
      context: ./backend
      args:
        REQUIREMENTS: requirements/dev.txt
    command: python worker.py
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://callagent_app:callagent_app@postgres:5432/callagent
      MIGRATION_DATABASE_URL: postgresql+asyncpg://callagent_migrator:callagent_migrator@postgres:5432/callagent
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_HOST: temporal:7233
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy

volumes:
  pgdata:
