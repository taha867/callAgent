name: backend-ci

on:
  pull_request:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
  workflow_dispatch:

env:
  DATABASE_URL: postgresql+asyncpg://callagent_app:callagent_app@localhost:5432/callagent
  MIGRATION_DATABASE_URL: postgresql+asyncpg://callagent_migrator:callagent_migrator@localhost:5432/callagent
  APP_DB_ROLE: callagent_app
  REDIS_URL: redis://localhost:6379/0
  TEMPORAL_HOST: localhost:7233
  TEMPORAL_NAMESPACE: default

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: callagent
          POSTGRES_USER: callagent
          POSTGRES_PASSWORD: callagent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U callagent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # GitHub Actions service containers have no inter-service ordering (all start in
      # parallel, unlike docker-compose's depends_on), so auto-setup may race Postgres on
      # first boot — it retries internally, and tests/integration/conftest.py's
      # temporal_env fixture falls back to a downloaded dev server if this container never
      # becomes reachable, so a flaky auto-setup here degrades gracefully rather than
      # failing the whole job.
      temporal:
        image: temporalio/auto-setup:1.29.7
        env:
          DB: postgres12
          DB_PORT: 5432
          POSTGRES_USER: callagent
          POSTGRES_PWD: callagent
          POSTGRES_SEEDS: localhost
        ports: ["7233:7233"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Download spaCy model (Phase 3 — privacy/'s Presidio NER pass)
        # Not a pip package — requirements/dev.txt installing presidio-analyzer/spacy alone
        # is not enough; without this the Presidio branch of privacy/scrubber.py's
        # find_presidio_matches() fails to load en_core_web_sm on first use. See
        # backend/README.md's Phase 3 note.
        run: python -m spacy download en_core_web_sm

      - name: Provision two-role DB setup
        # GitHub Actions service containers can't mount /docker-entrypoint-initdb.d — this
        # step is docker-compose's postgres-service init-script mount, applied explicitly.
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          PGPASSWORD=callagent psql -h localhost -U callagent -d callagent -f scripts/db/00-init-roles.sql

      - name: Wait for Temporal
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/7233) 2>/dev/null; then echo "temporal is up"; exit 0; fi
            sleep 2
          done
          echo "temporal did not come up in time — tests will fall back to a downloaded dev server"

      - name: Lint (ruff check)
        run: ruff check src tests scripts worker.py

      - name: Lint (ruff format --check)
        run: ruff format --check src tests scripts worker.py

      - name: Migration check (upgrade)
        run: alembic upgrade head

      - name: Migration check (reversibility)
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Gate — tool allow-list
        run: python scripts/ci/check_tool_allowlist.py

      - name: Gate — disposition/action codes
        run: python scripts/ci/check_disposition_action_codes.py

      - name: Gate — no raw prompt concatenation
        run: python scripts/ci/check_no_raw_prompt_concat.py

      - name: Gate — no unredacted transcript writes
        run: python scripts/ci/check_transcript_redaction.py

      - name: Tests
        run: pytest tests -v --cov=src --cov-report=term-missing

      - name: Type check (non-blocking)
        run: mypy src
        continue-on-error: true

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker compose up
        run: docker compose up -d --wait
        timeout-minutes: 5

      - name: Health check
        run: curl -f http://localhost:${BACKEND_HOST_PORT:-8001}/health

      - name: Confirm migrate ran and worker is up
        run: |
          docker compose ps
          [ "$(docker compose ps -q migrate | xargs docker inspect -f '{{.State.ExitCode}}')" = "0" ]
          docker compose ps worker --format '{{.State}}' | grep -qi running

      - name: docker compose down
        if: always()
        run: docker compose down -v
