[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]
extend-exclude = ["migrations/versions", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "T20", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"migrations/env.py" = ["E402", "F401"]
# F811 — a fixture imported from another test module (e.g. test_phase1_e2e.py::worker) and
# reused as a test's parameter name is the standard pytest cross-module fixture-reuse
# pattern, not an actual redefinition bug; ruff has no special-cased awareness of pytest
# fixture semantics for this shape. Phase 3, .claude/plans/phase-3-backend-implementation-
# plan.md Batch 12.
"tests/*" = ["S101", "F811"]
"scripts/ci/*" = ["T201"]
"scripts/seed_demo_data.py" = ["T201"]
"worker.py" = ["T201"]
# Phase 2 — genuine Arabic-language prompt/UI text (spec §2.2.3), not a Latin-lookalike typo.
"src/voice/prompt.py" = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["src", "scripts"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs a live Postgres and/or Temporal",
    "requires_temporal: needs TEMPORAL_HOST or a downloadable dev server",
    "requires_two_role_db: needs callagent_migrator + callagent_app roles",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["migrations/versions/", "tests/fixtures/"]
