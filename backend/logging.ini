; Spec §36 rule 18: never log OTP, PIN, CVV, password, or full payment-card data — anywhere.
; This applies to every formatter/handler added to this file in any later phase, not just
; the ones defined here today. No formatter may be configured to dump request/response
; bodies (that is exactly how an OTP or PIN ends up in a log line).

[loggers]
keys=root,sqlalchemy

[handlers]
keys=console

[formatters]
keys=default

[logger_root]
level=INFO
handlers=console

[logger_sqlalchemy]
level=WARNING
handlers=console
qualname=sqlalchemy.engine
propagate=0

[handler_console]
class=StreamHandler
level=NOTSET
formatter=default
args=(sys.stdout,)

[formatter_default]
format=%(asctime)s %(levelname)s %(name)s %(message)s
datefmt=%Y-%m-%dT%H:%M:%S%z
